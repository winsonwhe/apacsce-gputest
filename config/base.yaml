troubleshooting:
  default:
  - Inspect the saved raw command output; confirm tool paths, versions, permissions and timeouts.
  network_mode:
  - 'Check IMDS rdmaFabricData.planes: 4 is multiplanar; absent/1 is single-plane. Never infer from shape name.'
  - Compare --network-mode/config override with every target host; fix a wrong plane count before workloads.
  nvidia_smi:
  - Check driver loading, GPU enumeration, ECC state and SKU counts; inspect nvidia-smi and kernel Xid errors.
  gpu_topology:
  - Inspect nvidia-smi topo -m for missing GPU or NIC rows/columns; confirm PCIe enumeration and RDMA/driver installation.
  fabricmanager:
  - Inspect systemctl status/journal for nvidia-fabricmanager and ensure its version matches the driver.
  numa_topology:
  - Inspect numactl --hardware; only nodes with CPUs and nonzero memory count. Ignore the GB300 zero-MB nodes.
  rdma_iface: &id001
  - 'Check rdma link: required devices must be ACTIVE and LINK_UP; unused DOWN/DISABLED entries are normal.'
  - 'Multiplanar: verify vrf_r0..3 exist and each VF netdev is enslaved to the matching VRF.'
  - 'Single-plane: check discovered devices and netdev mappings; configure counts/pins for the deployment, without assuming
    VRF or IPv6.'
  rdma_link: *id001
  rdma_perf: &id002
  - Check server/client raw output, the control port/firewall, device pairing, MTU/GID/address family and per-rail IP routes.
  - 'Multiplanar: verify IPv6, GID index 3, VF/VRF binding and the configured NUMA mapping; compare all rails.'
  - Recheck placement and traffic before changing example limits or replacing a known-good baseline.
  rdma_bw: *id002
  rdma_lat: *id002
  rdma_read: *id002
  rdma_send: *id002
  gdr_perf:
  - Check nvidia-peermem, CUDA-enabled perftest support and GPU memory selection; compare device-memory bandwidth with host-memory
    RDMA.
  ssh_connectivity:
  - Verify BatchMode SSH, trusted known_hosts and keys from the controller and launcher host to every peer.
  gpu_burn:
  - Inspect numerical errors, Xid/ECC events, clocks, temperature, power caps and cooling; a throughput imbalance can indicate
    throttling.
  nvbandwidth:
  - Check the requested test names, CUDA build architecture, peer access/NVLink state and aggregate SUM units; calibrate floors
    per SKU.
  babelstream:
  - Check CUDA device selection, build architecture, memory clocks and MB/s-to-GB/s units; inspect each GPU, not just the
    average.
  storage:
  - Set storage.path to a dedicated mounted test directory; inspect df/lfs getstripe output and use an existing benchmark_file
    for read-only fio.
  dcgmi:
  - Inspect each DCGM test/entity result and warning; check supported diagnostic level, permissions, idle GPUs and DCGM/driver
    compatibility.
  placement:
  - 'Unexpected GMF: keep jobs of up to 18 hosts inside one customerGpuMemoryFabric; reduce --node-count or correct inventory.'
  - Across racks, prefer GMFs with matching customerLocalBlock; inspect IMDS or inventory when blocks differ.
  imex:
  - Check active nvidia-imex and nodes_config.cfg on every selected host; membership must stay within one GMF/rack, never
    across racks.
  - Use exact inventory hostnames/IPs and include additional same-rack members in placement.inventory.
  nccl_allreduce: &id003
  - Inspect NCCL/MPI output, all ranks/GPUs, HCA discovery, plugin/UCX availability and mode-specific environment settings.
  - Check GMF/local-block placement and per-GMF IMEX; compare largest-size in-place and out-of-place busbw with the named
    threshold source.
  nccl_alltoall: *id003
  baseline:
  - Use the same SKU, network mode, scale, level and workload options; inspect regressions before recalibrating on known-good
    hardware.
