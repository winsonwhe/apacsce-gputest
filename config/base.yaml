level_settings:
  basic:
    burn_duration_s: 120
    description: 'About 5 min: preflight + 2 min burn'
  standard:
    burn_duration_s: 1200
    description: Preflight + 20 min burn + bandwidth + DCGM r2 + RDMA
  extended:
    burn_duration_s: 3600
    description: 1h burn + DCGM r3 (configurable r4) + multi-host NCCL
baseline:
  tolerance_pct: 20
  tolerance_pct_by_check:
    gpu_burn: 10
    nccl_allreduce: 20
    nccl_alltoall: 20
network:
  expected_planes:
    single_plane: 1
    multiplanar: 4
  mode: auto
  imds_url: http://169.254.169.254/opc/v2/host
  imds_timeout_s: 2
  fallback_mode: single_plane
  single_plane:
    a10:
      hca_names: []
      expected_active_hcas: 0
    a100:
      hca_names: []
      expected_active_hcas: 8
    h100:
      hca_names: []
      expected_active_hcas: 8
    h200:
      hca_names: []
      expected_active_hcas: 8
    l40s:
      hca_names: []
      expected_active_hcas: 8
    b200:
      hca_names: []
      expected_active_hcas: 8
    b300:
      hca_names: []
      expected_active_hcas: 8
    gb200:
      hca_names: []
      expected_active_hcas: 4
    gb300:
      hca_names: []
      expected_active_hcas: 4
  multiplanar:
    vf_rails:
    - rdma_vf_rail0
    - rdma_vf_rail1
    - rdma_vf_rail2
    - rdma_vf_rail3
    vrfs:
    - vrf_r0
    - vrf_r1
    - vrf_r2
    - vrf_r3
    numa_map:
      '0': 0
      '1': 0
      '2': 1
      '3': 1
rdma_perf:
  timeout_s: 90
  port: 18515
  probe_timeout_s: 5
  ready_attempts: 30
  ready_interval_s: 0.2
  bw_args:
  - -F
  - -q
  - '2'
  - --report_gbits
  - -s
  - '8388608'
  - -D
  - '5'
  lat_args:
  - -F
  - -s
  - '8'
  - -n
  - '10000'
  read_args:
  - -F
  - -q
  - '2'
  - --report_gbits
  - -s
  - '8388608'
  - -D
  - '5'
  send_args:
  - -F
  - -q
  - '2'
  - --report_gbits
  - -s
  - '8388608'
  - -D
  - '5'
  gdr_args:
  - -F
  - -q
  - '2'
  - --report_gbits
  - -s
  - '8388608'
  - -D
  - '5'
  - --use_cuda
  single_plane:
    ip_family: auto
    extra_args: []
    bw_min_gbps: null
    lat_max_us: null
  multiplanar:
    ip_family: inet6
    extra_args:
    - -x
    - '3'
    - --ipv6
    - --ipv6-addr
    example_bw_gbps: 459
    example_lat_us: 4.0
    threshold_source: PDF example
    bw_min_gbps: 321.3
    lat_max_us: 6.0
placement:
  rack_max_nodes: 18
  inventory: {}
executor:
  setup_timeout_s: 120
  parallelism: 16
  timeout_s: 15
nccl:
  timeout_s: 1800
  args:
  - -b
  - 1G
  - -e
  - 16G
  - -f
  - '2'
  - -g
  - '1'
  - -n
  - '50'
  largest_size_bytes: 17179869184
  local_args:
  - -b
  - 1G
  - -e
  - 8G
  - -f
  - '2'
  local_threshold_gbs: null
  local_thresholds_gbs:
    a10:
      2: 14.0
  local_alltoall_threshold_gbs: null
  local_alltoall_thresholds_gbs:
    a10:
      2: 13.5
  baseline_threshold_pct: 80
  single_plane:
    env: {}
    mpi_args: []
    thresholds:
      allreduce: null
      alltoall: null
    example_reference_gbs:
      allreduce: {}
      alltoall: {}
  multiplanar:
    env:
      NCCL_SOCKET_IFNAME: eth0
      NCCL_IB_HCA: rdma_vf_rail0,rdma_vf_rail1,rdma_vf_rail2,rdma_vf_rail3
      NCCL_NET_PLUGIN: spcx
      NCCL_NET: IB
      NCCL_MNNVL_ENABLE: '1'
      NCCL_NVLS_ENABLE: '1'
      NCCL_IB_GID_INDEX: '3'
      NCCL_IB_TC: '96'
      NCCL_IB_ADAPTIVE_ROUTING: '1'
      UCX_NET_DEVICES: eth0
    mpi_args:
    - --mca
    - pml
    - ucx
    - --mca
    - coll
    - ^hcoll
    small_max_nodes: 32
    small_cluster:
      NCCL_TUNING_VARIANT: final_small_cta16_qps16
      NCCL_MIN_CTAS: '16'
      NCCL_IB_QPS_PER_CONNECTION: '16'
    large_cluster:
      NCCL_TUNING_VARIANT: final_large_cta32_qps1
      NCCL_MIN_CTAS: '32'
      NCCL_MAX_CTAS: '32'
      NCCL_IB_QPS_PER_CONNECTION: '1'
    thresholds:
      allreduce: null
      alltoall: null
    example_reference_gbs:
      allreduce: {}
      alltoall: {}
imex:
  nodes_file: /etc/nvidia-imex/nodes_config.cfg
  service: nvidia-imex
cuda:
  path: /usr/local/cuda
gpu_burn:
  backend: gpu-burn
  build_if_missing: true
  source_dir: tools/gpu-burn
  repository: https://github.com/wilicc/gpu-burn.git
  build_timeout_s: 600
  timeout_margin_s: 60
  tensor_core: true
  double: false
  memory_percentage: 90
  gpus: []
  compute_capability:
    b300: 103
    gb300: 103
    a10: 86
    a100: 80
    h100: 90
    h200: 90
    l40s: 89
    b200: 100
    gb200: 100
  perf_deviation_threshold_pct: 10
  sample_interval_s: 1
  sample_timeout_s: 10
  nvml_lib_path: null
  nvml_lib_aarch64: /usr/lib/aarch64-linux-gnu/libnvidia-ml.so.1
babelstream:
  build_if_missing: true
  source_dir: tools/BabelStream
  repository: https://github.com/UoB-HPC/BabelStream.git
  build_timeout_s: 600
  build_jobs: 4
  timeout_s: 300
  gpus: []
  cuda_arch:
    b300: sm_103
    gb300: sm_103
    a10: sm_86
    a100: sm_80
    h100: sm_90
    h200: sm_90
    l40s: sm_89
    b200: sm_100
    gb200: sm_100
  thresholds:
    b300:
      copy_min_gbs: 900
      mul_min_gbs: 900
      add_min_gbs: 900
      triad_min_gbs: 900
      dot_min_gbs: 100
    gb300:
      copy_min_gbs: 900
      mul_min_gbs: 900
      add_min_gbs: 900
      triad_min_gbs: 900
      dot_min_gbs: 100
    a10:
      copy_min_gbs: 300
      mul_min_gbs: 300
      add_min_gbs: 300
      triad_min_gbs: 300
      dot_min_gbs: 50
dcgmi:
  diag_levels:
    basic: 1
    standard: 2
    extended: 3
    a10_basic: 1
    a10_standard: 2
    a10_extended: 3
  timeout_s: 3600
nvbandwidth:
  build_if_missing: true
  source_dir: tools/nvbandwidth
  repository: https://github.com/NVIDIA/nvbandwidth.git
  build_timeout_s: 600
  build_jobs: 4
  timeout_s: 600
  cuda_arch:
    b300: 103
    gb300: 103
    a10: 86
  multinode: false
  mpi_args: []
  tests:
    a10:
      test_names:
      - device_to_device_bidirectional_memcpy_read_ce
      - host_to_device_memcpy_ce
      - device_to_host_memcpy_ce
      thresholds:
        device_to_device_bidirectional_memcpy_read_ce: 20
        host_to_device_memcpy_ce: 10
        device_to_host_memcpy_ce: 10
    gb300:
      test_names:
      - device_to_device_bidirectional_memcpy_read_ce
      thresholds:
        device_to_device_bidirectional_memcpy_read_ce: 9000
    a100:
      test_names:
      - device_to_device_bidirectional_memcpy_read_ce
      thresholds:
        device_to_device_bidirectional_memcpy_read_ce: null
    h100:
      test_names:
      - device_to_device_bidirectional_memcpy_read_ce
      thresholds:
        device_to_device_bidirectional_memcpy_read_ce: null
    h200:
      test_names:
      - device_to_device_bidirectional_memcpy_read_ce
      thresholds:
        device_to_device_bidirectional_memcpy_read_ce: null
    l40s:
      test_names:
      - device_to_device_bidirectional_memcpy_read_ce
      thresholds:
        device_to_device_bidirectional_memcpy_read_ce: null
    b200:
      test_names:
      - device_to_device_bidirectional_memcpy_read_ce
      thresholds:
        device_to_device_bidirectional_memcpy_read_ce: null
    gb200:
      test_names:
      - device_to_device_bidirectional_memcpy_read_ce
      thresholds:
        device_to_device_bidirectional_memcpy_read_ce: null
    b300:
